name: ReclaimIQ CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reclaimiq-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  frontend:
    name: Frontend lint, types, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate an ephemeral build session secret
        working-directory: .
        shell: python
        run: |
          import os
          import secrets
          value = secrets.token_urlsafe(32)
          print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f"AUTH_SECRET={value}\n")
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build

  python:
    name: Python safety checks and MCP image build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.3
      - name: Reject syntax errors and undefined names
        run: python -m ruff check --isolated --select E9,F63,F7,F82 backend worker mcp-server scripts seed ml
      - run: python -m compileall -q backend worker mcp-server scripts seed ml
      - run: docker build --tag reclaimiq-mcp:ci mcp-server

  security:
    name: Workflow validation and source secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Scan the checked-out source for secrets
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact --no-banner

  integration:
    name: Real local services and governance integration
    needs: [frontend, python, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Start, verify, and clean up the isolated CI stack
        run: python scripts/manage.py ci

  delivery:
    name: Package verified version-tag source
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, python, security, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python scripts/manage.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ReclaimIQ-source-${{ github.run_number }}
          path: |
            dist/ReclaimIQ-source.zip
            dist/SHA256SUMS.txt
            dist/BUILD.json
          if-no-files-found: error
          retention-days: 7
